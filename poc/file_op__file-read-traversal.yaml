# 任意文件读取（路径穿越）
# 类别：file_op　等级：高危
#
# 由 detectors/exploit.py 执行，每个接口只尝试一次：
# Linux（/etc/passwd）与 Windows（win.ini）各一条变体，命中 root:x:0:0
# 或 [fonts] 即判定成功，不尝试读取其它文件。
id: file-read-traversal
name: 任意文件读取（路径穿越）
category: file_op
severity: high
description: >-
  参数中的 ../ 未被过滤，服务端返回了 /etc/passwd 或 win.ini 等系统文件内容。
remediation: >-
  对文件名做白名单校验，拒绝 ../ 与绝对路径；用 realpath 归一化后必须落在
  允许目录内；不要用用户输入直接拼接文件路径。
tags:
- lfi
- traversal
- one-shot
request:
  method: GET
  paths: ['']
match: []
