# Web 服务器指纹
# 类别：指纹识别类：用于建立目标画像，本身不作为漏洞发现
# 等级：信息　适用技术：通用
id: fp-webserver
name: Web 服务器指纹
category: fingerprint
severity: info
description: 从响应头与页面特征识别 Web 服务器类型。
tags:
- fingerprint
request:
  method: GET
  paths:
  - ''
  expect_status:
  - 200
  - 301
  - 302
  - 401
  - 403
match:
- patterns:
  - apache
  - nginx
  - iis
  - tomcat
  - jetty
  - gunicorn
  - openresty
  - lighttpd
  - weblogic
  - jboss
  soft_404:
  - 404 not found
  - 页面不存在
  - page not found
  - not found</title>
  - no such file
  - 找不到该页面
  - error 404
